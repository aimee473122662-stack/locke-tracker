<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鲜食计算器">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23faf8f5' width='100' height='100' rx='20'/><text font-size='50' x='50' y='65' text-anchor='middle'>🐕</text></svg>">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;鲜食计算器&quot;,&quot;short_name&quot;:&quot;鲜食计算&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#faf8f5&quot;,&quot;theme_color&quot;:&quot;#d9773c&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23faf8f5' width='100' height='100' rx='20'/><text font-size='50' x='50' y='65' text-anchor='middle'>🐕</text></svg>&quot;,&quot;sizes&quot;:&quot;100x100&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<title>鲜食计算器</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --border: #e8e4df; --text: #3d3929; --text2: #7a7566;
    --accent: #d9773c; --accent2: #e8935a; --green: #5a9e6f; --green2: #e8f5e9;
    --red: #c0392b; --red2: #fdecea; --blue: #4a90b8; --blue2: #e8f4fa;
    --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; max-width: 920px; margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 700; color: #2d2a1f; }
  .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 18px; }

  .card { background: var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h3 { font-size:14px; font-weight:700; margin-bottom:10px; color:#2d2a1f; display:flex; align-items:center; gap:7px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .field { flex:1; min-width:100px; }
  .field label { display:block; font-size:10px; font-weight:700; color:var(--text2); margin-bottom:3px; text-transform:uppercase; letter-spacing:0.03em; }
  .field input,.field select { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; background:#fcfbf9; color:var(--text); }
  .field input:focus,.field select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(217,119,60,0.1); }
  .field .hint { font-size:10px; color:var(--text2); }

  .result-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:8px; }
  .result-item { background:#fcfbf9; border-radius:8px; padding:10px 12px; text-align:center; }
  .result-item .val { font-size:20px; font-weight:700; color:var(--accent); }
  .result-item .lbl { font-size:10px; color:var(--text2); }

  .feeding-plan { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .plan-card { border-radius:10px; padding:14px 16px; border:1px solid var(--border); }
  .plan-card.fresh { background:#fef9f5; border-color:#f0dcc8; }
  .plan-card.kibble { background:#f5f8fb; border-color:#d0dce8; }
  .plan-card h4 { font-size:12px; font-weight:700; margin-bottom:6px; }
  .plan-card .big { font-size:26px; font-weight:800; }
  .plan-card .unit { font-size:12px; color:var(--text2); }

  /* 配比表 */
  .ratio-table { width:100%; border-collapse:collapse; font-size:12px; }
  .ratio-table th { text-align:left; padding:6px 8px; font-size:10px; font-weight:700; color:var(--text2); text-transform:uppercase; border-bottom:2px solid var(--border); }
  .ratio-table td { padding:7px 8px; border-bottom:1px solid #f0ede8; }
  .ratio-table td input { width:100%; padding:5px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; background:#fcfbf9; }
  .ratio-table .highlight td { background:#fef9f5; }
  .ratio-table .need { color:var(--accent); font-weight:700; }
  .ratio-table .done { color:var(--green); }

  .btn { padding:7px 14px; border-radius:8px; border:none; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .btn-green { background:var(--green2); color:var(--green); border:1px solid #c8e6c9; }
  .btn-green:hover { background:#c8e6c9; }
  .btn-accent { background:var(--accent); color:#fff; width:100%; padding:11px; font-size:14px; margin-top:4px; }
  .btn-accent:hover { background:var(--accent2); }
  .btn-blue { background:var(--blue2); color:var(--blue); border:1px solid #c8dde8; }
  .btn-blue:hover { background:#d0e4f0; }
  .btn-outline { background:none; border:1px dashed var(--accent); color:var(--accent); }
  .btn-outline:hover { background:#fef5ef; }

  .dog-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .dog-tab { padding:7px 15px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s; color:var(--text); }
  .dog-tab:hover { border-color:var(--accent); }
  .dog-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .dog-tab .close { font-size:15px; margin-left:3px; opacity:0.6; cursor:pointer; }
  .dog-tab .close:hover { opacity:1; }

  .suggestion { background:#fffcf5; border:1px solid #f0e4c8; border-radius:8px; padding:12px 16px; margin-top:10px; font-size:12px; line-height:1.7; }
  .warn { background:var(--red2); border:1px solid #f5c6cb; border-radius:8px; padding:10px 14px; margin-top:10px; font-size:12px; color:#a71d2a; }
  .good { background:var(--green2); border:1px solid #c8e6c9; border-radius:8px; padding:10px 14px; margin-top:10px; font-size:12px; color:#2d6a3b; }
  .gap-bar { display:flex; height:7px; border-radius:4px; overflow:hidden; background:#f0ede8; margin-top:3px; }
  .gap-bar .fill { background:var(--green); }
  .gap-bar .missing { background:#f5c6cb; }

  .ratio-preset { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
  .ratio-preset button { padding:4px 10px; border-radius:12px; border:1px solid var(--border); background:#fff; font-size:11px; cursor:pointer; font-family:inherit; }
  .ratio-preset button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .inline-edit { width:50px; padding:2px 4px; border:1px solid var(--border); border-radius:4px; font-size:11px; text-align:center; font-family:inherit; }

  @media (max-width:640px) {
    body { padding:6px; font-size:14px; }
    h1 { font-size:18px; }
    .card { padding:10px 12px; }
    .row { flex-direction:column; gap:6px; }
    .field { min-width:100%; }
    .field input,.field select { font-size:16px; padding:10px 8px; } /* 防iOS缩放 */
    .feeding-plan { grid-template-columns:1fr; }
    .result-grid { grid-template-columns:repeat(2,1fr); }
    /* 配比表 → 卡片式 */
    .ratio-table, .ratio-table thead, .ratio-table tbody, .ratio-table th, .ratio-table td, .ratio-table tr { display:block; }
    .ratio-table thead { display:none; }
    .ratio-table tr { border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px; background:#fcfbf9; }
    .ratio-table td { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border:none; font-size:13px; }
    .ratio-table td::before { content:attr(data-label); font-weight:700; font-size:10px; color:var(--text2); text-transform:uppercase; margin-right:8px; white-space:nowrap; }
    .ratio-table td input, .ratio-table td select { width:auto; flex:1; max-width:150px; font-size:14px; }
    /* 方案按钮换行 */
    .ratio-preset { gap:4px; }
    .ratio-preset button { font-size:11px; padding:5px 8px; }
    /* 喂养计划 */
    .feeding-plan { gap:6px; }
    .plan-card .big { font-size:22px; }
    /* 狗狗标签 */
    .dog-tabs { gap:4px; }
    .dog-tab { padding:6px 10px; font-size:12px; }
    /* 汇总表卡片化 */
    #batchSummary table, #batchSummary thead, #batchSummary tbody, #batchSummary th, #batchSummary td, #batchSummary tr { display:block; width:100%; }
    #batchSummary tr { border-bottom:1px solid var(--border); padding:4px 0; }
    #batchSummary td:first-child { font-weight:700; }
    #batchSummary td:last-child { color:var(--text); }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<h1>🐕 鲜食计算器</h1>
<p class="subtitle">采购大份食材 → 自动算配比缺什么 → 蛋壳粉精确克数 → 分装冷冻。犬猫通用。</p>

<!-- ═══════ 狗狗标签 ═══════ -->
<div class="dog-tabs" id="dogTabs"></div>

<!-- ═══════ 狗狗档案 ═══════ -->
<div class="card">
  <h3><span>👤</span> <span id="dogNameTitle">狗狗档案</span></h3>
  <div class="row">
    <div class="field"><label>名字</label><input type="text" id="dogName" onchange="saveDog()" placeholder="如：豆豆"></div>
    <div class="field"><label>物种</label><select id="species" onchange="onSpeciesChange()">
      <option value="dog">🐶 犬</option><option value="cat">🐱 猫</option>
    </select></div>
    <div class="field"><label>体重 kg</label><input type="number" id="weight" value="5" min="0.5" max="15" step="0.1" onchange="saveDog()"></div>
    <div class="field">
      <label>年龄</label>
      <div class="row" style="gap:3px;">
        <input type="number" id="ageYears" value="2" min="0" max="20" onchange="saveDog()" style="flex:1;" placeholder="岁">
        <span style="font-size:11px;color:var(--text2);align-self:center;">岁</span>
        <input type="number" id="ageMonths" value="0" min="0" max="11" onchange="saveDog()" style="flex:1;" placeholder="月">
      </div>
    </div>
    <div class="field"><label>绝育状态</label><select id="spayed" onchange="saveDog()">
      <option value="intact">未绝育</option><option value="spayed">已绝育</option>
    </select></div>
    <div class="field"><label>每日运动量</label><select id="exercise" onchange="saveDog()">
      <option value="indoor">仅室内活动</option><option value="walk30" selected>散步遛弯 30min</option><option value="run1h">户外跑跳 1h</option><option value="run2h">户外运动 2h+</option>
    </select></div>
  </div>
  <div class="result-grid" id="dogStats"></div>
</div>

<!-- ═══════ 喂养模式 ═══════ -->
<div class="card">
  <h3><span>🥣</span> 喂养模式</h3>
  <div class="row">
    <div class="field"><label>模式</label><select id="feedMode" onchange="saveDog()">
      <option value="full">全鲜食</option><option value="half" selected>半鲜食（每天狗粮+鲜食各一顿）</option><option value="alternate">隔天鲜食</option><option value="custom">自定义%</option>
    </select></div>
    <div class="field" id="customRatioF" style="display:none;"><label>鲜食占比%</label><input type="number" id="customRatio" value="50" min="10" max="90" onchange="saveDog()"></div>
    <div class="field"><label>狗粮品牌</label><input type="text" id="kibbleBrand" placeholder="皇家小型成犬" onchange="saveDog()"></div>
    <div class="field"><label>狗粮 kcal/g</label><input type="number" id="kibbleKcal" value="3.8" min="2.5" max="5.5" step="0.1" onchange="saveDog()"><span class="hint">包装袋有标注</span></div>
    <div class="field"><label>准备几天的鲜食</label><input type="number" id="batchDays" value="7" min="1" max="60" onchange="updatePlan()"><span class="hint">批量制作的总天数</span></div>
  </div>
  <div class="feeding-plan" id="feedingPreview"></div>
</div>

<!-- ═══════ 核心：肉类配比 ═══════ -->
<div class="card" style="border:2px solid var(--accent);border-left:4px solid var(--accent);">
  <h3><span>⚖️</span> 肉类配比计算 —— 核心
    <span style="font-weight:400;font-size:11px;color:var(--text2);margin-left:auto;">填"已有"列 → 自动算"还需"</span>
  </h3>

  <div class="ratio-preset" style="margin-bottom:8px;">
    <span style="font-size:11px;color:var(--text2);margin-right:4px;">配比：</span>
    <button class="active" onclick="setRatio('standard')">小型犬</button>
    <button onclick="setRatio('largeDog')">大型犬</button>
    <button onclick="setRatio('lowTear')">低泪痕</button>
    <button onclick="setRatio('lean')">低脂</button>
    <button onclick="setRatio('highRed')">偏红肉</button>
    <button onclick="setRatio('puppy')">幼犬/孕期</button>
    <button onclick="setRatio('senior')">老年犬</button>
    <button onclick="setRatio('cat')">🐱猫</button>
  </div>
  <div class="ratio-tips" id="ratioTips" style="font-size:11px;line-height:1.7;padding:10px 12px;background:#fffcf5;border:1px solid #f0e4c8;border-radius:8px;margin-bottom:8px;"></div>

  <table class="ratio-table">
    <thead>
      <tr><th>类别</th><th>占比</th><th>已有食材</th><th>已有 g</th><th>需总量 g</th><th style="color:var(--accent);">还需 g</th><th>说明</th></tr>
    </thead>
    <tbody id="ratioBody"></tbody>
  </table>

  <!-- 自动汇总 -->
  <div style="margin-top:12px;padding:12px;background:#f9f7f3;border-radius:8px;font-size:13px;" id="ratioSummary"></div>
</div>

<!-- ═══════ 碳水 & 蔬菜 ═══════ -->
<div class="card" id="carbVegCard">
  <h3><span>🍚🥬</span> 每顿现加（蔬菜 & 主食，不冷冻）</h3>
  <div class="row">
    <div class="field"><label>主食:肉比例</label><select id="carbRatio" onchange="updatePlan()">
      <option value="0.5">1:2（主食=肉量50%）</option>
      <option value="0.6" selected>1:1.67（主食=肉量60%·推荐）</option>
      <option value="0.7">1:1.4（主食=肉量70%）</option>
      <option value="0.4">1:2.5（主食=肉量40%）</option>
    </select></div>
    <div class="field"><label>主食选择</label><select id="carbChoice" onchange="updatePlan()">
      <option value="糙米饭（熟）">糙米饭（熟）</option>
      <option value="红薯（熟）" selected>红薯（熟）</option>
      <option value="燕麦粥（熟）">燕麦粥（熟）</option>
      <option value="山药（熟）">山药（熟）</option>
      <option value="南瓜（熟）">南瓜（熟）</option>
      <option value="藜麦饭（熟）">藜麦饭（熟）</option>
      <option value="__other__">✏️ 其它（手动输入）</option>
    </select></div>
    <div class="field"><label>蔬菜选择</label><select id="vegChoice" onchange="updatePlan()">
      <option value="西兰花（生）">西兰花（生）</option>
      <option value="胡萝卜（生）">胡萝卜（生）</option>
      <option value="菠菜（生）">菠菜（焯水）</option>
      <option value="青豆（生）">青豆（生）</option>
      <option value="西葫芦（生）">西葫芦（生）</option>
      <option value="__other__">✏️ 其它（手动输入）</option>
    </select></div>
  </div>
  <div style="margin-top:10px;font-size:13px;padding:10px;background:#fcfbf9;border-radius:8px;" id="carbVegEstimate"></div>
</div>

<!-- ═══════ 蛋壳粉精确计算 ═══════ -->
<div class="card" style="border:2px solid var(--green);border-left:4px solid var(--green);">
  <h3><span>🥚</span> 蛋壳粉精确计算</h3>
  <div style="font-size:13px;line-height:1.8;" id="calciumCalc"></div>
</div>

<!-- ═══════ 鱼油 & VE ═══════ -->
<div class="card" style="border:2px solid var(--blue);border-left:4px solid var(--blue);" id="fishOilCard">
  <h3><span>🐟💊</span> 鱼油 & 维生素E 补充建议</h3>
  <div style="font-size:13px;line-height:1.8;" id="fishOilCalc"></div>
</div>

<!-- ═══════ 汇总 & 分装 ═══════ -->
<div class="card">
  <h3><span>📦</span> 批量制作汇总 & 分装指南</h3>
  <div style="font-size:13px;line-height:1.9;" id="batchSummary"></div>
</div>

<!-- ═══════ 保存图片 ═══════ -->
<div class="card" style="text-align:center;">
  <button class="btn btn-accent" onclick="saveAsImage()" style="width:auto;padding:10px 24px;">📸 保存汇总为图片</button>
  <div style="font-size:10px;color:var(--text2);margin-top:6px;">将上方「冷冻分装」汇总截图为PNG下载</div>
</div>

<!-- ═══════ 营养验证 ═══════ -->
<div class="card">
  <button class="btn btn-accent" onclick="validateNutrition()">🔬 验证：单日营养是否达标</button>
  <div id="validationResult" style="margin-top:12px;"></div>
</div>

<!-- ═══════ 食材数据库 ═══════ -->

<script>
// ============================================================
// 全局状态
// ============================================================
const LS_KEY = "dog_batch_calc_v3";
const FOOD_DB = JSON.parse(document.getElementById("foodData").textContent);

let state = { dogs: [], activeIdx: 0 };

// 配比方案
const RATIOS = {
  // 小型犬推荐：白肉为主，红肉为辅（减少泪痕 + 胰腺炎风险）
  standard:  { "红肉":30, "白肉":45, "心脏":10, "肝脏":5, "其他器官":5, "蛋":5 },
  // 大型犬推荐：红肉比例适中，加鱼护关节
  largeDog:  { "红肉":35, "白肉":35, "鱼":5, "心脏":10, "肝脏":5, "其他器官":5, "蛋":5 },
  // 低泪痕：几乎无红肉，极低铁摄入。依赖肝脏补铁

function loadState() {
  try { const s=localStorage.getItem(LS_KEY); if(s) state=JSON.parse(s); } catch(e){}
  if (!state.dogs||state.dogs.length===0) state={dogs:[makeDefaultDog("豆豆")],activeIdx:0};
  // 兼容旧数据：activity → spayed+exercise
  state.dogs.forEach(d=>{
    if(!d.spayed) d.spayed="intact";
    if(!d.species) d.species="dog";
    if(!d.exercise) { d.exercise=d.activity>=1.8?"run1h":d.activity>=1.6?"run1h":"walk30"; }

    if(!d.vegChoice) d.vegChoice="西兰花（生）";
  });
}

// 热量计算
// ============================================================
function getAgeMult(y,m) {
  const tm=y*12+m;
  if(tm<4) return 3.0;
  if(tm<12) return 2.0;
  if(y<7) return 1.0;
  return 0.8;
}
// 成犬热量系数：基准 × 运动量调整（幼犬/老年犬不受绝育和运动量影响）
function getAdultFactor(spayed, exercise) {
  const base = spayed==="intact" ? 1.8 : 1.6;
  const adj = { indoor:-0.2, walk30:0, run1h:0.2, run2h:0.4 };
  return base + (adj[exercise]||0);
}
function dailyKcal(kg,y,m,spayed,exercise) {
  const rer=70*Math.pow(Math.max(kg,0.5),0.75);
  const am=getAgeMult(y,m);
  // 幼犬(<1岁)和老年犬(≥7岁)用年龄系数，不受绝育/运动量影响
  if(y<1 && m<12) return Math.round(rer*am);
  if(y>=7) return Math.round(rer*am);
  // 成犬：年龄系数1.0 × 绝育+运动量系数
  return Math.round(rer*getAdultFactor(spayed,exercise));
}

function updateDogStats() {
  const d=getDog();
  const der=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise);
  const am=getAgeMult(d.ageYears,d.ageMonths);
  const lbl=d.ageYears<1?`幼犬(${d.ageMonths}月)`:d.ageYears>=7?"老年犬":"成犬";
  let factorLabel="";
  if(d.ageYears>=1 && d.ageYears<7) {
    factorLabel=getAdultFactor(d.spayed,d.exercise).toFixed(1)+"× ("+(d.spayed==="intact"?"未绝育":"已绝育")+")";
  } else {
    factorLabel=am.toFixed(1)+"× (阶段)";
  }
  document.getElementById("dogStats").innerHTML=`
    <div class="result-item"><div class="val">${der}</div><div class="lbl">日需热量 kcal</div></div>
    <div class="result-item"><div class="val">${lbl}</div><div class="lbl">年龄阶段</div></div>
    <div class="result-item"><div class="val">${factorLabel}</div><div class="lbl">热量系数</div></div>
    <div class="result-item"><div class="val">${Math.round(d.weight*4.5)}-${Math.round(d.weight*6)}g</div><div class="lbl">蛋白质/天</div></div>
    <div class="result-item"><div class="val">${Math.round(d.weight*120)}mg</div><div class="lbl">钙/天</div></div>`;
}

function renderRatioTable() {
  const d=getDog(), ratio=RATIOS[currentRatio];
  const der=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise);
  let fr=0;
  switch(d.feedMode) { case"full":fr=1;break; case"half":fr=0.5;break; case"alternate":fr=0.5;break; case"custom":fr=d.customRatio/100;break; }
  const dailyFKcal=der*fr;
  const freshMeals = d.feedMode==="full" ? 2 : 1;

  // ── 核心：每袋肉量 = 狗一顿鲜食实际需要的肉量（由热量定，不动）──
  const perMeatKcal = dailyFKcal / freshMeals; // 每顿鲜食热量
  const perBagMeatGoal = Math.round(perMeatKcal / 1.6); // 肉约1.6kcal/g

  // 总肉量 = 每袋肉量 × 天数 × 顿数
  const totalMeatEst = perBagMeatGoal * d.batchDays * freshMeals;

  // 收集用户输入
  let userTotal={};
  for(let cat in FOOD_DB) userTotal[cat]=0;
  for(let cat in userInput) {
    if(userInput[cat]) userInput[cat].forEach(ing=>{ userTotal[cat]=(userTotal[cat]||0)+ing.grams; });
  }

  // ── 锚定逻辑：已填食材中反推最大总肉量，锁死不再缩 ──
  let baseTotal=totalMeatEst; // 默认估算值
  for(let cat in userTotal) {
    const grams=userTotal[cat];
    const pct=(ratio[cat]||0);
    if(grams>0 && pct>0) {
      const implied=Math.round(grams/(pct/100));
      if(implied>baseTotal) baseTotal=implied; // 只放大不缩小
    }
  }

  // 自动调天数：如果已填肉量超出当前天数估算
  const totalUserMeat = Object.values(userTotal).reduce((a,b)=>a+b,0);
  if (totalUserMeat > 0) {
    const impliedDays = Math.max(1, Math.round(baseTotal / (perBagMeatGoal * freshMeals)));
    if (impliedDays !== d.batchDays) {
      d.batchDays = Math.min(impliedDays, 365);
      document.getElementById("batchDays").value = d.batchDays;
      saveState();
    }
  }

  // 每个类别
  let rows="";
  const categories=["红肉","白肉","鱼","心脏","肝脏","其他器官","蛋"];
  categories.forEach(cat=>{
    const pct=(ratio[cat]||0);
    const need=Math.round(baseTotal*pct/100);
    const have=userTotal[cat]||0;
    const gap=Math.max(0,need-have);
    const foods=FOOD_DB[cat]||[];
    const rec = RECOMMENDED_MEATS[currentRatio] || {};
    const recFood = rec[cat] || "";
    const foodOpts=foods.map(f=>`<option value="${f.name}">${f.name}${f.name===recFood?' ⭐':''}</option>`).join("");
    // Add "other" option
    const allOpts = foodOpts + `<option value="__other__">✏️ 其它（手动输入）</option>`;
    const currentFood=userInput[cat]&&userInput[cat].length>0?userInput[cat][0].food:(recFood||foods[0]?.name||"");

    rows+=`<tr class="${gap>0?'highlight':''}">
      <td data-label="类别"><strong>${cat}</strong></td>
      <td data-label="占比">${pct}%</td>
      <td data-label="食材"><select onchange="userSetFood('${cat}',0,this.value)" style="width:100%;padding:4px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-family:inherit;">${allOpts.replace(`value="${currentFood}"`,`value="${currentFood}" selected`)}</select>
      <span id="otherFood_${cat}" style="display:none;margin-top:4px;"><input type="text" placeholder="食材名" onchange="userSetCustomFood('${cat}',this.value)" style="width:100%;padding:3px;border:1px solid var(--border);border-radius:4px;font-size:10px;font-family:inherit;"></span></td>
      <td data-label="已有g"><input type="number" value="${have||''}" placeholder="${have?'':'如 500'}" min="0" max="50000" step="1" onchange="userSetGrams('${cat}',0,parseFloat(this.value)||0)" style="width:100%;padding:4px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;"></td>
      <td data-label="需总量">${need}<span style="font-size:10px;color:var(--text2);">g</span></td>
      <td data-label="还需" class="${gap>0?'need':'done'}">${gap>0?'+'+gap+'g':'✅ 够'}</td>
      <td data-label="说明" style="font-size:10px;color:var(--text2);">${foods[0]?Math.round(foods[0].prot)+'%蛋白':''}</td>
    </tr>`;
  });

  document.getElementById("ratioBody").innerHTML=rows;

  // 汇总
  const totalHave=Object.values(userTotal).reduce((a,b)=>a+b,0);
  const totalNeed=baseTotal;
  const totalGap=Math.max(0,totalNeed-totalHave);

  let sumH=`<strong>每袋肉量：${perBagMeatGoal}g</strong>（${perMeatKcal.toFixed(0)}kcal/顿）| 总肉量：<strong>${baseTotal}g</strong>（已有 ${totalHave}g，`;
  if(totalGap>0) sumH+=`还需 <span style="color:var(--accent);font-weight:700;">${totalGap}g</span>`;
  else sumH+=`已满足`;
  sumH+=`）| 可供 <strong>${d.batchDays}</strong> 天 × ${freshMeals}顿/天 = <strong>${d.batchDays*freshMeals}</strong> 袋 | <span style="font-size:10px;color:var(--text2);">填肉自动调天数</span>`;

  document.getElementById("ratioSummary").innerHTML=sumH;

  // 更新碳水/蔬菜/钙/汇总 —— 用实际已有肉量，无输入时用估算
  const actualMeat=totalHave>0?totalHave:baseTotal;
  updateCarbVeg(actualMeat);
  updateCalcium(actualMeat);
  updateFishOil(actualMeat);
  updateBatchSummary(actualMeat, baseTotal);
}

function userSetFood(cat,idx,food) {
  if(food==="__other__") {
    // Show custom input
    const el = document.getElementById("otherFood_"+cat);
    if(el) el.style.display="block";
    return;
  }
  // Hide custom input
  const el = document.getElementById("otherFood_"+cat);
  if(el) el.style.display="none";
  if(!userInput[cat]) userInput[cat]=[];
  if(!userInput[cat][idx]) userInput[cat][idx]={food,grams:0,customNutrients:null};
  else { userInput[cat][idx].food=food; userInput[cat][idx].customNutrients=null; }
  renderRatioTable();
}
function userSetCustomFood(cat,name) {
  if(!name) return;
  if(!userInput[cat]) userInput[cat]=[];
  if(!userInput[cat][0]) userInput[cat][0]={food:name,grams:0,customNutrients:{prot:20,fat:8,cal:160,ca:5,p:200}};
  else { userInput[cat][0].food=name; userInput[cat][0].customNutrients=userInput[cat][0].customNutrients||{prot:20,fat:8,cal:160,ca:5,p:200}; }
  renderRatioTable();
}
function userSetGrams(cat,idx,grams) {
  if(!userInput[cat]) userInput[cat]=[];
  const foods=FOOD_DB[cat]||[];
  const foodName = userInput[cat][idx]?.food || foods[0]?.name || "";
  if(!userInput[cat][idx]) userInput[cat][idx]={food:foodName,grams,customNutrients:null};
  else userInput[cat][idx].grams=grams;
  renderRatioTable();
}

function updateCarbVeg(totalMeat) {
  const d=getDog();
  const cr=parseFloat(d.carbRatio)||0.6;
  const carbG=Math.round(totalMeat*cr);
  const vegG=Math.round(totalMeat*0.25);
  const meals = d.feedMode==="full" ? 2 : 1; // 全鲜食每天2顿鲜食，半鲜食每天1顿鲜食
  const perMealCarb=Math.round(carbG/d.batchDays/meals);
  const perMealVeg=Math.round(vegG/d.batchDays/meals);
  document.getElementById("carbVegEstimate").innerHTML=`
    🗓 每天主食总量：<strong>${d.carbChoice}</strong> <strong>${Math.round(carbG/d.batchDays)}g</strong>（肉量×${cr}）+ 蔬菜 <strong>${d.vegChoice}</strong> <strong>${Math.round(vegG/d.batchDays)}g</strong><br>
    🥣 <strong>每顿鲜食现加</strong>：主食 <strong style="color:var(--accent);">${perMealCarb}g</strong> + 蔬菜 <strong style="color:var(--accent);">${perMealVeg}g</strong>（${meals}顿鲜食/天，不冷冻）`;
}

function updateCalcium(totalMeat) {
  const d=getDog();
  const der=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise);
  let fr=0;
  switch(d.feedMode) { case"full":fr=1;break; case"half":fr=0.5;break; case"alternate":fr=0.5;break; case"custom":fr=d.customRatio/100;break; }

  // 计算这批肉的总磷
  let totalP=0, totalCa=0;
  for(let cat in userInput) {
    if(!userInput[cat]) continue;
    userInput[cat].forEach(ing=>{
      if(ing.grams<=0||!ing.food) return;
      // Use custom nutrients if available
      if(ing.customNutrients) {
        totalP+=ing.customNutrients.p*ing.grams/100;
        totalCa+=ing.customNutrients.ca*ing.grams/100;
        return;
      }
      const allFoods=FOOD_DB[cat]||[];
      const f=allFoods.find(x=>x.name===ing.food);
      if(f) { totalP+=f.p*ing.grams/100; totalCa+=f.ca*ing.grams/100; }
    });
  }

  // 钙需求 = 磷总量 × 1.0（钙磷比目标） - 食材自带钙
  const needCa=Math.max(0, totalP*1.0-totalCa);
  const eggshellG=needCa/400; // 蛋壳粉≈400mg钙/g

  document.getElementById("calciumCalc").innerHTML=`
    📐 计算逻辑：<strong>蛋壳粉克数 = (肉总磷 − 肉自带钙) ÷ 400</strong><br>
    🦴 总肉量 <strong>${totalMeat}g</strong> →
    总磷 ≈ <strong>${Math.round(totalP)}mg</strong> |
    自带钙 ≈ <strong>${Math.round(totalCa)}mg</strong><br>
    🎯 钙磷比 1:1 目标 →
    需补钙 ≈ <strong>${Math.round(needCa)}mg</strong><br>
    🥚 <span style="font-size:16px;font-weight:800;color:var(--green);">蛋壳粉 = ${eggshellG.toFixed(1)}g</span>
    （约${Math.ceil(eggshellG*5)}撮）<br>
    <span style="font-size:10px;color:var(--text2);">蛋壳粉每g≈400mg钙 | ${needCa>0?'':'✅ 食材自带钙已足够' }</span>`;
}

function updateFishOil(totalMeat) {
  const d=getDog();
  const w=d.weight;

    🐟 <strong>鱼油剂量</strong>：<strong style="color:var(--blue);">${fishOilLo}-${fishOilHi}mg EPA+DHA/天</strong>（${w}kg × 20-50mg/kg）<br>
    🧴 市售鱼油约 300mg EPA+DHA / 1ml → 约 <strong>${fishOilMlLo}-${fishOilMlHi}ml/天</strong><br>
    💊 <strong style="color:var(--accent);">维生素E</strong>：<strong>${veLo}-${veHi} IU/天</strong>（每g鱼油需约10IU VE抗氧化）<br>
    <span style="font-size:10px;color:var(--text2);">💡 鱼油和VE是配套的——鱼油易氧化，缺VE反而有害。选天然型d-α-生育酚，吸收率更好。</span>`;
  }

  // 碘/锰建议
  if(!hasFish||fishPct<10) {
    h+=`<div style="margin-top:8px;padding:8px 10px;background:#fef9f5;border-radius:6px;font-size:11px;line-height:1.6;">
    🧂 <strong>碘</strong>：肌肉肉碘含量低，建议 <strong>每7-10天</strong> 加一小撮海带粉（约0.1g）或几滴无碘盐替代品。<br>
    🦪 <strong>锰</strong>：肌肉肉几乎不含锰，建议 <strong>每7天</strong> 加少量青口贝/贻贝粉（约0.5g/5kg体重）。
    </div>`;
  } else {
    h+=`<div style="margin-top:8px;padding:8px 10px;background:#fef9f5;border-radius:6px;font-size:11px;line-height:1.6;">
    🦪 <strong>锰</strong>：肌肉肉几乎不含锰，建议 <strong>每7天</strong> 加少量青口贝/贻贝粉（约0.5g/5kg体重）。
    </div>`;
  }

  // B族提醒：无鱼方案大概率是全熟食
  if(!hasFish) {
    h+=`<div style="margin-top:6px;padding:6px 10px;background:#fffcf5;border:1px solid #f0e4c8;border-radius:6px;font-size:11px;">
    ⚠️ <strong>B族维生素提醒</strong>：本方案无生鱼，如果肉类全部高温煮沸后再冷冻，B1（硫胺素）会大量损失。建议定期给少量生肉/内脏（冷冻≥3周杀菌）作为B族来源，或每周补1/4片复合B族。
    </div>`;

function updateBatchSummary(totalMeat, baseTotal) {
  const d=getDog();
  const targetMeat=baseTotal||totalMeat;
  const der=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise);
  let fr=0;
  switch(d.feedMode) { case"full":fr=1;break; case"half":fr=0.5;break; case"alternate":fr=0.5;break; case"custom":fr=d.customRatio/100;break; }
  const dailyK=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise)*fr;

  const cr=parseFloat(d.carbRatio)||0.6;
  const carbG=Math.round(totalMeat*cr);
  const vegG=Math.round(totalMeat*0.25);

  // 每顿鲜食次数
  const freshMeals = d.feedMode==="full" ? 2 : 1;

  let totalP=0,totalCa=0;
  for(let cat in userInput) {
    if(!userInput[cat]) continue;
    userInput[cat].forEach(ing=>{
      if(ing.grams<=0||!ing.food) return;
      if(ing.customNutrients) {
        totalP+=ing.customNutrients.p*ing.grams/100;
        totalCa+=ing.customNutrients.ca*ing.grams/100;
        return;
      }
      const allFoods=FOOD_DB[cat]||[];
      const f=allFoods.find(x=>x.name===ing.food);
      if(f) { totalP+=f.p*ing.grams/100; totalCa+=f.ca*ing.grams/100; }
    });
  }
  const eggshellG=(Math.max(0,totalP*1.0-totalCa)/400);

  // 每袋肉量 = 由热量公式定（不随总肉量变化）
  const perMeatKcal = dailyK / freshMeals;
  const perBagMeat = Math.round(perMeatKcal / 1.6);
  const bags = d.batchDays * freshMeals;
  const perBagEggshell = eggshellG / bags;
  const meatPackGrams = Math.round(perBagMeat + perBagEggshell);

  // 每顿主食蔬菜
  const perMealCarb=Math.round(carbG/d.batchDays/freshMeals);
  const perMealVeg=Math.round(vegG/d.batchDays/freshMeals);

  // 狗粮克数
  const kKcal=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise)*(1-fr);
  const kibbleG=fr<1?Math.round(kKcal/d.kibbleKcal):0;

  let h=`<table style="width:100%;font-size:12px;border-collapse:collapse;">
    <tr style="border-bottom:2px solid var(--accent);"><td colspan="2" style="padding:8px;font-size:13px;font-weight:700;color:var(--accent);">🧊 冷冻分装（仅肉类+蛋壳粉，蔬菜主食每天现加）</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;font-weight:700;">总肉量</td><td style="padding:6px;"><strong>${totalMeat}g</strong></td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;font-weight:700;">蛋壳粉（混入肉中）</td><td style="padding:6px;color:var(--green);font-weight:700;">${eggshellG.toFixed(1)}g</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;font-weight:700;">${d.batchDays} 天 × ${freshMeals}顿/天</td><td style="padding:6px;">分 <strong>${bags}</strong> 袋（每袋=1顿）</td></tr>
    <tr style="border-bottom:2px solid var(--accent);"><td style="padding:6px;font-weight:700;">📌 每袋肉重</td><td style="padding:6px;"><strong>${meatPackGrams}g</strong> = 肉${perBagMeat}g + 蛋壳粉${perBagEggshell.toFixed(1)}g</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;font-weight:700;">每袋热量</td><td style="padding:6px;color:var(--text2);">约 ${Math.round(dailyK/freshMeals)} kcal（不含主食蔬菜）</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;font-weight:700;">🦴 狗粮</td><td style="padding:6px;">${kibbleG>0?'<strong>'+kibbleG+'g/天</strong>（单独称）':'无（全鲜食）'}</td></tr>
    <tr><td style="padding:6px;font-weight:700;color:var(--accent);">🥬 每顿现加</td><td style="padding:6px;">主食 <strong>${perMealCarb}g</strong>（${d.carbChoice}）+ 蔬菜 <strong>${perMealVeg}g</strong>（${d.vegChoice}）×${freshMeals}顿鲜食/天</td></tr>
  </table>`;

  if(d.feedMode==="alternate") {
    h+=`<div style="margin-top:8px;font-size:11px;color:var(--blue);">📅 隔天模式：共做${d.batchDays}天鲜食，实际覆盖约 ${d.batchDays*2} 个日历天</div>`;
  }

  document.getElementById("batchSummary").innerHTML=h;
}

function validateNutrition() {
  saveDog();
  const d=getDog();
  const der=dailyKcal(d.weight,d.ageYears,d.ageMonths,d.spayed,d.exercise);
  let fr=0;
  switch(d.feedMode) { case"full":fr=1;break; case"half":fr=0.5;break; case"alternate":fr=0.5;break; case"custom":fr=d.customRatio/100;break; }
  const targetKcal=Math.round(der*fr);

  // 累加每日营养
  let tProt=0,tFat=0,tCal=0,tCa=0,tP=0,tFiber=0,tCarb=0,tGrams=0;

  // 肉类
  for(let cat in userInput) {
    if(!userInput[cat]) continue;
    const foods=FOOD_DB[cat]||[];
    userInput[cat].forEach(ing=>{
      if(ing.grams<=0||!ing.food) return;
      let prot=0,fat=0,cal=0,ca=0,p=0;
      if(ing.customNutrients) {
        prot=ing.customNutrients.prot; fat=ing.customNutrients.fat; cal=ing.customNutrients.cal; ca=ing.customNutrients.ca; p=ing.customNutrients.p;
      } else {
        const f=foods.find(x=>x.name===ing.food);
        if(!f) return;
        prot=f.prot; fat=f.fat; cal=f.cal; ca=f.ca; p=f.p;
      }
      const daily=ing.grams/d.batchDays, r=daily/100;
      tProt+=prot*r; tFat+=fat*r; tCal+=cal*r; tCa+=ca*r; tP+=p*r; tGrams+=daily;
    });
  }

  // 主食
  const totalMeat=Object.values(userInput).flat().reduce((s,i)=>s+(i.grams||0),0);
  const dailyCarbG=Math.round(totalMeat*parseFloat(d.carbRatio)/d.batchDays);
  const carbName=d.carbChoice;
  const carbData={ prot:1.5,fat:0.1,cal:85,ca:30,p:55,fiber:3 }; // 默认红薯
  if(carbName==="糙米饭（熟）") Object.assign(carbData,{prot:1.2,fat:0.3,cal:100,ca:3,p:50,fiber:1});
  if(carbName==="燕麦粥（熟）") Object.assign(carbData,{prot:2.5,fat:1.5,cal:72,ca:10,p:60,fiber:1.7});
  if(carbName==="南瓜（熟）") Object.assign(carbData,{prot:1,fat:0.1,cal:32,ca:20,p:30,fiber:1});
  if(carbName==="山药（熟）") Object.assign(carbData,{prot:1.5,fat:0.1,cal:72,ca:18,p:50,fiber:4});
  if(carbName==="藜麦饭（熟）") Object.assign(carbData,{prot:4.4,fat:1.9,cal:120,ca:17,p:150,fiber:2.8});
  const cr=dailyCarbG/100;
  tProt+=carbData.prot*cr; tFat+=carbData.fat*cr; tCal+=carbData.cal*cr; tCa+=carbData.ca*cr; tP+=carbData.p*cr; tFiber+=carbData.fiber*cr; tCarb+=carbData.prot>0?20*cr:0; tGrams+=dailyCarbG;

  // 蔬菜
  const dailyVegG=Math.round(totalMeat*0.25/d.batchDays);
  const vegName=d.vegChoice;
  // 蔬菜数据库
  const vegDB={
    "西兰花（生）":{prot:2.4,fat:0.1,cal:25,ca:40,p:67,fiber:3.3},
    "胡萝卜（生）":{prot:0.9,fat:0.2,cal:41,ca:33,p:35,fiber:2.8},
    "菠菜（焯水）":{prot:2.9,fat:0.4,cal:23,ca:99,p:49,fiber:2.2},
    "青豆（生）":{prot:5.4,fat:0.4,cal:81,ca:25,p:108,fiber:4.5},
    "西葫芦（生）":{prot:1.2,fat:0.3,cal:17,ca:16,p:38,fiber:1.1},
  };
  const vegData=vegDB[vegName]||{prot:2.4,fat:0.1,cal:25,ca:40,p:67,fiber:3.3};
  const vr=dailyVegG/100;
  tProt+=vegData.prot*vr; tFat+=vegData.fat*vr; tCal+=vegData.cal*vr; tCa+=vegData.ca*vr; tP+=vegData.p*vr; tFiber+=vegData.fiber*vr; tGrams+=dailyVegG;

  // 蛋壳粉补钙
  const eggshellG=(Math.max(0,tP*1.0-tCa)/400);
  tCa+=eggshellG*400;

  const caRatio=tP>0?tCa/tP:0;
  const reqProtMin=Math.round(d.weight*4.5*fr);
  const reqCa=Math.round(d.weight*120*fr);

  const bar=(v,t)=>{
    const pct=t>0?Math.min(v/t,1.5)*100:0;
    return `<div class="gap-bar"><div class="fill" style="width:${Math.min(pct,100)}%"></div><div class="missing" style="width:${Math.max(pct-100,0)}%"></div></div>`;
  };

  let h=`<div style="font-size:12px;margin-top:8px;"><strong>单日鲜食（约${Math.round(tGrams)}g）：</strong></div>
  <table style="width:100%;font-size:12px;margin-top:8px;border-collapse:collapse;">
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:4px;">🔥 热量</td><td style="padding:4px;">${Math.round(tCal)}/${targetKcal} kcal</td><td style="padding:4px;">${Math.round(tCal/targetKcal*100)}% ${bar(tCal,targetKcal)}</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:4px;">🥩 蛋白质</td><td style="padding:4px;">${tProt.toFixed(1)}g / ≥${reqProtMin}g</td><td style="padding:4px;">${Math.round(tProt/reqProtMin*100)}% ${bar(tProt,reqProtMin)}</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:4px;">🦴 钙(含蛋壳粉)</td><td style="padding:4px;">${Math.round(tCa)}mg / ${reqCa}mg</td><td style="padding:4px;">${Math.round(tCa/reqCa*100)}% ${bar(tCa,reqCa)}</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:4px;">⚖️ 钙磷比</td><td style="padding:4px;color:${caRatio>=1&&caRatio<=2?'var(--green)':'var(--red)'};"><strong>${caRatio.toFixed(1)}:1</strong></td><td style="padding:4px;">${caRatio>=1&&caRatio<=2?'✅':'⚠️'}</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:4px;">🌿 纤维</td><td style="padding:4px;">${tFiber.toFixed(1)}g</td><td style="padding:4px;"></td></tr>
  </table>`;

  if(caRatio<1) h+=`<div class="warn">⚠️ 钙磷比偏低！请增加蛋壳粉或减少高磷食材。</div>`;
  if(caRatio>2) h+=`<div class="warn">⚠️ 钙磷比偏高！</div>`;
  if(caRatio>=1&&caRatio<=2&&Math.abs(tCal-targetKcal)<targetKcal*0.15) h+=`<div class="good">✅ 营养均衡，钙磷比达标！</div>`;

  document.getElementById("validationResult").innerHTML=h;
}

// ============================================================
// 全局更新
// ============================================================
function updateAll() {
  updateDogStats();
  updateFeedingPreview();
  renderRatioTable();
}

function updatePlan() { saveDog(); updateAll(); }

function renderAll() {
  renderTabs();
  loadDogForm();
  updateAll();
}

// ============================================================
// 初始化
// ============================================================
loadState();
renderAll();

// 修改 feedMode 联动
document.getElementById("feedMode").addEventListener("change",()=>{
  document.getElementById("customRatioF").style.display=
    document.getElementById("feedMode").value==="custom"?"":"none";
  saveDog();
});

// 物种切换 → 自动切换配比方案
function onSpeciesChange() {
  saveDog();
  const species = document.getElementById("species").value;
  if (species === "cat") {
    setRatioUI("cat");
  } else if (currentRatio === "cat") {
    setRatioUI("standard");
  }
  updateAll();
}
function setRatioUI(name) {
  currentRatio = name;
  document.querySelectorAll(".ratio-preset button").forEach(b=>b.classList.remove("active"));
  const btns = document.querySelectorAll(".ratio-preset button");
  btns.forEach(b => {
    if (name==="cat" && b.textContent.includes("猫")) b.classList.add("active");
    else if (name==="standard" && b.textContent==="小型犬") b.classList.add("active");
    else if (name==="largeDog" && b.textContent==="大型犬") b.classList.add("active");
    else if (name==="lowTear" && b.textContent==="低泪痕") b.classList.add("active");
    else if (name==="lean" && b.textContent==="低脂") b.classList.add("active");
    else if (name==="highRed" && b.textContent==="偏红肉") b.classList.add("active");
    else if (name==="puppy" && b.textContent.includes("幼犬")) b.classList.add("active");
    else if (name==="senior" && b.textContent==="老年犬") b.classList.add("active");
  });
  document.getElementById("ratioTips").innerHTML = RATIO_TIPS[name] || "";
  const carbCard = document.getElementById("carbVegCard");
  if (name === "cat") carbCard.style.display = "none";
  else carbCard.style.display = "";
}

// ============================================================
// 保存图片
// ============================================================
function saveAsImage() {
  const main = document.body;
  html2canvas(main, { scale: 2, backgroundColor: "#faf8f5" }).then(canvas => {
    const link = document.createElement("a");
    link.download = "鲜食计算器_" + new Date().toISOString().slice(0,10) + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(e => alert("截图失败：" + e));
}

// 碳水/蔬菜「其它」选项
document.getElementById("carbChoice").addEventListener("change", function() {
  const val = this.value;
  if (val === "__other__") {
    const name = prompt("请输入主食名称：", "");
    if (name) {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name; opt.selected = true;
      this.insertBefore(opt, this.lastChild);
    }
  }
  updatePlan();
});
document.getElementById("vegChoice").addEventListener("change", function() {
  const val = this.value;
  if (val === "__other__") {
    const name = prompt("请输入蔬菜名称：", "");
    if (name) {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name; opt.selected = true;
      this.insertBefore(opt, this.lastChild);
    }
  }
  updatePlan();
});
</script>
